name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore BillingPlatform.sln

      - name: Build
        run: dotnet build BillingPlatform.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BillingPlatform.sln --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (lint + typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm run test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: billing-platform-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: billing-platform-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  smoke:
    name: Container production smoke test
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate disposable credentials
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 32)"
          jwt_signing_key="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$jwt_signing_key"
          printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password" >> "$GITHUB_ENV"
          printf 'JWT_SIGNING_KEY=%s\n' "$jwt_signing_key" >> "$GITHUB_ENV"

      - name: Start production stack
        run: docker compose up --build --detach

      - name: Exercise production stack
        run: ./scripts/smoke-test.sh

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Tear down production stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
