services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billing_platform
      POSTGRES_USER: billing_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_platform -d billing_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__BillingPlatform: Host=postgres;Port=5432;Database=billing_platform;Username=billing_platform;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in a .env file (openssl rand -base64 48)}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_API_MOCKING: disabled
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"

volumes:
  postgres-data:
